
server:
  port: 8081

spring:
  application:
    name: resource-service
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      # ১. রিসোর্স সার্ভার কনফিগারেশন (ইনকামিং টোকেন ভেরিফাই করার জন্য)
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000

      # ২. ওথ২ ক্লায়েন্ট কনফিগারেশন (সার্ভিস-টু-সার্ভিস কলের জন্য)
      client:
        registration:
          internal-service: # আপনার WebClientConfig এ দেওয়া নামের সাথে মিল থাকতে হবে
            client-id: internal-service-client
            client-secret: internal-secret
            authorization-grant-type: client_credentials
            scope: internal:read,internal:write
        provider:
          internal-service:
            issuer-uri: http://localhost:9000

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    preferIpAddress: true
    instanceId: ${spring.application.name}:${random.uuid}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.security: DEBUG
    com.example.resource: DEBUG
    org.springframework.web: DEBUG














